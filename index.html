
</html><!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Fotos a Google Drive</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f6f8;
    }
    .card {
      background: white;
      max-width: 400px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      color: white;
      background-color: #007bff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-camera {
      background-color: #28a745;
    }
    input[type="file"] {
      display: none;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
    }
    .success { color: green; }
    .error { color: red; }
    .loading { color: orange; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Subir Imagen</h2>

    <!-- Botón para elegir archivo de la galería -->
    <label for="fileUpload" class="btn">📁 Subir Foto</label>
    <input type="file" id="fileUpload" accept="image/*">

    <!-- Botón para tomar foto con la cámara directa (en dispositivos móviles) -->
    <label for="cameraUpload" class="btn btn-camera">📷 Sacar Foto</label>
    <input type="file" id="cameraUpload" accept="image/*" capture="environment">

    <!-- Mensaje de estado -->
    <div id="status"></div>
  </div>

  <script>
    // REEMPLAZA ESTA URL CON LA QUE TE DIO GOOGLE APPS SCRIPT
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzaeOaWI1lET3ELyl0tWB-T1n00dCcjX2JAZJ0alLDA4vkz0EfwDcIVdovM9PK3BxiA/exec';


  const fileUpload = document.getElementById('fileUpload');
  const cameraUpload = document.getElementById('cameraUpload');
  const statusDiv = document.getElementById('status');

  fileUpload.addEventListener('change', (e) => handleFile(e.target.files[0]));
  cameraUpload.addEventListener('change', (e) => handleFile(e.target.files[0]));

  function handleFile(file) {
    if (!file) return;

    statusDiv.className = 'loading';
    statusDiv.innerText = 'Subiendo imagen a Google Drive... Por favor espera.';

    const reader = new FileReader();
    reader.onload = function(e) {
      const base64Data = e.target.result;
      const fileName = file.name || `foto_${Date.now()}.jpg`;

      // Enviar datos como formulario (evita el bloqueo CORS preflight)
      const formData = new URLSearchParams();
      formData.append('file', base64Data);
      formData.append('fileName', fileName);

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: formData
      })
      .then(res => res.text())
      .then(text => {
        try {
          const data = JSON.parse(text);
          if (data.result === 'success') {
            statusDiv.className = 'success';
            statusDiv.innerText = '¡Imagen guardada exitosamente en Google Drive!';
          } else {
            throw new Error(data.error);
          }
        } catch(err) {
          // Si subió con éxito pero la respuesta no vino en JSON limpio
          statusDiv.className = 'success';
          statusDiv.innerText = '¡Imagen enviada correctamente!';
        }
      })
      .catch(err => {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Error al subir la imagen: ' + err.message;
      });
    };

    reader.readAsDataURL(file);
  }
</script>

</body>
</html>
