<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis XV - Caty</title>
    
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Montserrat', sans-serif;
        text-align: center;
        padding: 15px;
        background-color: #f4f6f8;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        background: #ffffff;
        padding: 30px 20px;
        border-radius: 16px;
        width: 100%;
        max-width: 380px;
        margin: 0 auto;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      }
      .subtituloI {
        font-family: 'Montserrat', sans-serif;
        color: #B8860B;
        font-size: 1.1rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 4px;
        text-align: center;
        margin-bottom: 5px;
      }
      .cata {
        font-family: 'Great Vibes', cursive;
        color: #2c3e50;
        font-size: 3.8rem;
        line-height: 1.1;
        margin-bottom: 25px;
        text-align: center;
        font-weight: 400;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 16px 0;
        margin: 12px 0;
        font-size: 1rem;
        font-weight: 600;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-camera {
        background-color: #007bff;
      }
      .btn-gallery {
        background-color: #28a745;
      }
      input[type="file"] {
        display: none;
      }
      #status {
        margin-top: 18px;
        font-size: 0.95rem;
        font-weight: 600;
      }
      .loading {
        color: #e67e22;
      }
      .success {
        color: #27ae60;
      }
      .error {
        color: #c0392b;
      }
    </style>
  </head>
  <body>

    <div class="card">
      <h2 class="subtituloI">Mis XV</h2>
      <h1 class="cata">Caty</h1>
      
      <!-- Botón Sacar Foto (Abre Cámara) -->
      <label for="cameraInput" class="btn btn-camera">📷 Sacar foto</label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processFile(this)">

      <!-- Botón Subir Foto (Abre Galería) -->
      <label for="galleryInput" class="btn btn-gallery">🖼️ Subir foto</label>
      <input type="file" id="galleryInput" accept="image/*" onchange="processFile(this)">

      <div id="status"></div>
    </div>

    <!-- Formulario oculto que envía los datos pesados por POST -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="uploadForm" method="POST" target="hidden_iframe" style="display:none;">
      <input type="hidden" name="base64" id="formBase64">
      <input type="hidden" name="fileName" id="formFileName">
    </form>

    <script>
      // === REEMPLAZA AQUÍ CON TU URL DE APPS SCRIPT ===
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_SwGg3uxHT7genS4nMlSCTtw14nhYSoaRw4nVaqi6At2GzBvb7I5FgPiRzU0wG4Bi/exec";

      const uploadForm = document.getElementById('uploadForm');
      uploadForm.action = SCRIPT_URL;

      function processFile(input) {
        var file = input.files[0];
        if (!file) return;

        var statusDiv = document.getElementById('status');
        statusDiv.className = 'loading';
        statusDiv.innerHTML = "Subiendo foto, por favor espera...";

        var reader = new FileReader();
        reader.onload = function(e) {
          var base64Data = e.target.result;
          var fileName = "Foto_" + new Date().getTime() + "_" + file.name;

          document.getElementById('formBase64').value = base64Data;
          document.getElementById('formFileName').value = fileName;

          // Enviar el formulario por detrás
          uploadForm.submit();
          input.value = ""; 
        };

        reader.readAsDataURL(file);
      }

      // Escuchar la respuesta devuelta por Google desde el iframe oculto
      window.addEventListener('message', function(e) {
        var statusDiv = document.getElementById('status');
        if (e.data === 'SUCCESS') {
          statusDiv.className = 'success';
          statusDiv.innerHTML = "¡Foto subida con éxito!";
        } else if (typeof e.data === 'string' && e.data.startsWith('ERROR:')) {
          statusDiv.className = 'error';
          statusDiv.innerHTML = "Error al subir: " + e.data.replace('ERROR:', '');
        }
      });
    </script>

  </body>
</html>
