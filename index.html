<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis XV - Caty</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Montserrat', sans-serif;
        text-align: center;
        padding: 15px;
        background-color: #f4f6f8;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        background: #ffffff;
        padding: 30px 20px;
        border-radius: 16px;
        width: 100%;
        max-width: 380px;
        margin: 0 auto;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      }
      .subtituloI {
        font-family: 'Montserrat', sans-serif;
        color: #B8860B;
        font-size: 1.1rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 4px;
        text-align: center;
        margin-bottom: 5px;
      }
      .cata {
        font-family: 'Great Vibes', cursive;
        color: #2c3e50;
        font-size: 3.8rem;
        line-height: 1.1;
        margin-bottom: 25px;
        text-align: center;
        font-weight: 400;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 16px 0;
        margin: 12px 0;
        font-size: 1rem;
        font-weight: 600;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .btn-camera {
        background-color: #007bff;
      }
      .btn-gallery {
        background-color: #28a745;
      }
      input[type="file"] {
        display: none;
      }
      #status {
        margin-top: 18px;
        font-size: 0.95rem;
        font-weight: 600;
        min-height: 24px;
      }
      .loading { color: #e67e22; }
      .success { color: #27ae60; }
      .error { color: #c0392b; }
      
      /* Ocultar el iframe invisible */
      iframe { display: none; }
    </style>
  </head>
  <body>

    <div class="card">
      <h2 class="subtituloI">Mis XV</h2>
      <h1 class="cata">Caty</h1>
      
      <!-- Formulario invisible que se envía directamente a Apps Script -->
      <!-- IMPORTANTE: Coloca tu URL terminada en /exec en el 'action' -->
      <form id="uploadForm" action="https://script.google.com/macros/s/AKfycbxznB6VBCfSg4SUIEP18gzG0g1QOI0m9QFK8FY1bLIvbVYPXN5cmkfAhm3jsyOMowEM/exec" method="POST" enctype="multipart/form-data" target="hidden_iframe">
        
        <label for="cameraInput" class="btn btn-camera">📷 Sacar foto</label>
        <input type="file" id="cameraInput" name="file" accept="image/*" capture="environment" onchange="submitForm()">

        <label for="galleryInput" class="btn btn-gallery">🖼️ Subir foto</label>
        <input type="file" id="galleryInput" name="file" accept="image/*" onchange="submitFormGallery(this)">
        
      </form>

      <!-- Iframe para recibir la respuesta de Google sin recargar la página -->
      <iframe name="hidden_iframe" id="hidden_iframe" onload="onUploadComplete()"></iframe>

      <div id="status"></div>
    </div>

    <script>
      var isSubmitting = false;

      function submitForm() {
        var statusDiv = document.getElementById('status');
        statusDiv.className = 'loading';
        statusDiv.innerHTML = "🚀 Subiendo a la galería de Caty...";
        isSubmitting = true;
        document.getElementById('uploadForm').submit();
      }

      function submitFormGallery(input) {
        // Asignar la imagen seleccionada de la galería al campo activo del formulario
        if (input.files && input.files[0]) {
          submitForm();
        }
      }

      function onUploadComplete() {
        if (isSubmitting) {
          var statusDiv = document.getElementById('status');
          statusDiv.className = 'success';
          statusDiv.innerHTML = "¡Foto subida con éxito! 🎉";
          isSubmitting = false;
          document.getElementById('uploadForm').reset();
        }
      }
    </script>

  </body>
</html>
