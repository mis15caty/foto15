<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis XV - Caty</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Montserrat', sans-serif;
        text-align: center;
        padding: 15px;
        background-color: #f4f6f8;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        background: #ffffff;
        padding: 30px 20px;
        border-radius: 16px;
        width: 100%;
        max-width: 380px;
        margin: 0 auto;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      }
      .subtituloI {
        font-family: 'Montserrat', sans-serif;
        color: #B8860B;
        font-size: 1.1rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 4px;
        text-align: center;
        margin-bottom: 5px;
      }
      .cata {
        font-family: 'Great Vibes', cursive;
        color: #2c3e50;
        font-size: 3.8rem;
        line-height: 1.1;
        margin-bottom: 25px;
        text-align: center;
        font-weight: 400;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 16px 0;
        margin: 12px 0;
        font-size: 1rem;
        font-weight: 600;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-camera {
        background-color: #007bff;
      }
      .btn-gallery {
        background-color: #28a745;
      }
      input[type="file"] {
        display: none;
      }
      #status {
        margin-top: 18px;
        font-size: 0.95rem;
        font-weight: 600;
        min-height: 24px;
      }
      .loading {
        color: #e67e22;
      }
      .success {
        color: #27ae60;
      }
      .error {
        color: #c0392b;
      }
    </style>
  </head>
  <body>

    <div class="card">
      <h2 class="subtituloI">Mis XV</h2>
      <h1 class="cata">Caty</h1>
      
      <!-- Botón Sacar Foto (Abre Cámara) -->
      <label for="cameraInput" class="btn btn-camera">📷 Sacar foto</label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processFile(this)">

      <!-- Botón Subir Foto (Abre Galería) -->
      <label for="galleryInput" class="btn btn-gallery">🖼️ Subir foto</label>
      <input type="file" id="galleryInput" accept="image/*" onchange="processFile(this)">

      <div id="status"></div>
    </div>

    <script>
      function processFile(input) {
        var file = input.files[0];
        if (!file) return;

        var statusDiv = document.getElementById('status');
        statusDiv.className = 'loading';
        statusDiv.innerHTML = "⚡ Procesando foto...";

        // Intentar redimensionar/comprimir
        resizeImage(file, 1280, 0.7, function(base64Output) {
          statusDiv.innerHTML = "🚀 Subiendo a la galería de Caty...";
          var fileName = "Foto_" + new Date().getTime() + ".jpg";

          google.script.run
            .withSuccessHandler(function(response) {
              if (response && response.indexOf("Error") === -1) {
                statusDiv.className = 'success';
                statusDiv.innerHTML = "¡Foto subida con éxito! 🎉";
              } else {
                statusDiv.className = 'error';
                statusDiv.innerHTML = response || "Error desconocido al subir.";
              }
              input.value = "";
            })
            .withFailureHandler(function(err) {
              statusDiv.className = 'error';
              statusDiv.innerHTML = "Error de conexión: " + (err.message || err);
              input.value = "";
            })
            .uploadFile(base64Output, fileName);
        });
      }

      function resizeImage(file, maxWidth, quality, callback) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onerror = function() {
            // Si el formato es de iPhone no soportado por canvas (HEIC antiguo), envía el Base64 original directo
            callback(e.target.result);
          };
          img.onload = function() {
            try {
              var canvas = document.createElement('canvas');
              var width = img.width;
              var height = img.height;

              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }

              canvas.width = width;
              canvas.height = height;

              var ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              var dataUrl = canvas.toDataURL('image/jpeg', quality);
              callback(dataUrl);
            } catch (err) {
              // Si falla la compresión en Safari, enviamos el archivo original
              callback(e.target.result);
            }
          };
          img.src = e.target.result;
        };
        reader.onerror = function() {
          alert("Error al leer la foto en el dispositivo.");
        };
        reader.readAsDataURL(file);
      }
    </script>

  </body>
</html>
